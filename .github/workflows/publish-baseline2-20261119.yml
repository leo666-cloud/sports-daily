name: publish-baseline2-20261119
on:
  push:
    paths:
      - '.github/workflows/publish-baseline2-20261119.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tools with validation
        run: |
          set -e
          curl -fSL --retry 5 --retry-delay 3 'https://aka.doubaocdn.com/s/Uct02mfliU' -o tools/gate.py
          curl -fSL --retry 5 --retry-delay 3 'https://aka.doubaocdn.com/s/3RFZId7dun' -o tools/BASELINE.md
          test $(wc -c < tools/gate.py) -gt 6000
          test $(wc -c < tools/BASELINE.md) -gt 2000
          grep -q '章节 chip' tools/gate.py
          grep -q '版式与交互基线' tools/BASELINE.md
          wc -c tools/gate.py tools/BASELINE.md
      - name: Gate
        run: |
          pip install -q html5lib
          python3 tools/gate.py index.html archive/2026-11-19.html
      - name: Commit
        run: |
          git config user.name 'sports-daily-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add tools/gate.py tools/BASELINE.md
          git commit -m 'lock layout baseline and regression gates v2'
          git push
