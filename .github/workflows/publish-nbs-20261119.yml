name: publish-nbs-20261119
on:
  push:
    paths:
      - '.github/workflows/publish-nbs-20261119.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          curl -fSL --retry 5 --retry-delay 3 'https://aka.doubaocdn.com/s/xcyoJooBV8' -o index.html
          curl -fSL --retry 5 --retry-delay 3 'https://aka.doubaocdn.com/s/OmLw6lGO5J' -o archive/2026-11-19.html
          test $(wc -c < index.html) -gt 55000
          test $(wc -c < archive/2026-11-19.html) -gt 55000
          grep -q '国家统计局' index.html
          wc -c index.html archive/2026-11-19.html
      - name: Gate
        run: |
          pip install -q html5lib
          python3 tools/gate.py index.html archive/2026-11-19.html
      - name: Commit
        run: |
          git config user.name 'sports-daily-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add index.html archive/2026-11-19.html
          git commit -m '2026-11-19 add NBS sports data'
          git push
