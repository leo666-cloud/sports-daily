name: publish-20261126
on:
  push:
    paths:
      - '.github/workflows/publish-20261126.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and gate
        run: |
          mkdir -p archive
          curl -fsSL https://paste.rs/Q34N8 -o index.html
          curl -fsSL https://paste.rs/IJMSu -o archive/2026-11-26.html
          pip install html5lib beautifulsoup4
          python3 tools/gate.py index.html archive/2026-11-26.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add index.html archive/2026-11-26.html
          git commit -m '2026-11-26' || exit 0
          git push
