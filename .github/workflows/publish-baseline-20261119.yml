name: publish-baseline-20261119
on:
  push:
    paths:
      - '.github/workflows/publish-baseline-20261119.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tools
        run: |
          curl -sSL 'https://aka.doubaocdn.com/s/Uct02mfliU' -o tools/gate.py
          curl -sSL 'https://aka.doubaocdn.com/s/3RFZId7dun' -o tools/BASELINE.md
          wc -c tools/gate.py tools/BASELINE.md
      - name: Gate
        run: |
          pip install -q html5lib
          python3 tools/gate.py index.html archive/2026-11-19.html
      - name: Commit
        run: |
          git config user.name 'sports-daily-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add tools/gate.py tools/BASELINE.md
          git commit -m 'lock layout baseline and regression gates'
          git push
