name: publish-20261118
on:
  push:
    paths:
      - .github/workflows/publish-20261118.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch-html
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/3I5cv5clkH' -o index.html
          mkdir -p archive
          curl -fsSL 'https://aka.doubaocdn.com/s/1n9Nqno75E' -o archive/2026-11-18.html
          wc -c index.html archive/2026-11-18.html
      - name: gate
        run: |
          python3 -m pip install --quiet html5lib
          python3 tools/gate.py index.html archive/2026-11-18.html
      - name: commit
        run: |
          git config user.name 'sports-daily-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add index.html archive/2026-11-18.html
          git diff --cached --quiet || git commit -m '2026-11-18'
          git push
