name: fix-1127-c
on:
  push:
    paths:
      - '.github/workflows/fix-1127-c.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install gate deps
        run: python3 -m pip install --quiet html5lib
      - name: download and verify
        run: |
          curl -fsSL https://paste.c-net.org/FitchDresser -o index.html
          mkdir -p archive
          curl -fsSL https://paste.c-net.org/RiggsFrigging -o archive/2026-11-27.html
          python3 tools/gate.py index.html archive/2026-11-27.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html archive/2026-11-27.html
          git commit -m '2026-11-27 final content'
          git push origin HEAD:main
