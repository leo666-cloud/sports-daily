name: sd-push-1125-fix
on:
  push:
    paths:
      - '.github/workflows/sd-push-1125-fix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          curl -sSL 'https://paste.rs/P7g84' -o index.html
          curl -sSL 'https://paste.rs/tIpFV' -o archive/2026-11-25.html
          wc -c index.html archive/2026-11-25.html
      - name: Gate
        run: |
          pip install -q html5lib
          python3 tools/gate.py index.html archive/2026-11-25.html
      - name: Commit
        run: |
          git config user.name 'sports-daily-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add index.html archive/2026-11-25.html
          git commit -m '2026-11-25 scoreboard layout fix'
          git push
