name: publish-20261119d
on:
  push:
    paths:
      - '.github/workflows/publish-20261119d.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch gate
        run: |
          curl -sSL 'https://aka.doubaocdn.com/s/uHkMVMbu0g' -o tools/gate.py
          python3 -m py_compile tools/gate.py
          grep -c 'stock-card' tools/gate.py
      - name: Commit
        run: |
          git config user.name 'sports-daily-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add tools/gate.py
          git commit -m 'gate: assert stock-card not nested'
          git push
