<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>体育与运动品牌动态 · 2026-10-17</title>
<link rel='stylesheet' href='style.css'>
<style>
html,body{margin:0;padding:0;background:var(--sys-bg,#F6F5F1);height:100%}
#frame{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block;background:var(--sys-bg,#F6F5F1)}
</style>
</head>
<body>
<iframe id='frame' src='archive/2026-10-17.html' title='体育与运动品牌动态 2026-10-17'></iframe>
<script>
(function(){
var f=document.getElementById('frame');
function fix(){
  var d=f.contentDocument;
  if(!d)return;
  var st=d.createElement('style');
  st.textContent='body.wx-rain,body.wx-storm,body.wx-snow,body.wx-fog,body.wx-cloud,body.wx-sun,body.wx-haze,body.wx-dust{background:var(--sys-bg)!important}.shell{background:transparent!important}#wx{opacity:1;filter:brightness(1.5)}';
  d.head.appendChild(st);
  function build(){
    var cls=d.body.className;
    var rain=/wx-rain|wx-storm/.test(cls),snow=/wx-snow/.test(cls),fog=/wx-fog|wx-haze/.test(cls);
    var old=d.getElementById('fx2');if(old)old.remove();
    if(!rain&&!snow&&!fog)return;
    var cv=d.createElement('canvas');cv.id='fx2';
    cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1';
    d.body.appendChild(cv);
    var c=cv.getContext('2d'),W,H;
    function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
    var P=[],N=rain?190:snow?160:30;
    for(var i=0;i<N;i++){P.push({x:Math.random()*W,y:Math.random()*H,v:rain?3.4:snow?0.8:0.35,r:rain?1.3:snow?2.2:70+Math.random()*110,a:rain?0.5:snow?0.6:0.16})}
    function loop(){c.clearRect(0,0,W,H);P.forEach(function(p){
      if(rain){c.strokeStyle='rgba(120,165,215,.5)';c.lineWidth=1.4;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-4,p.y+19);c.stroke();p.y+=p.v;p.x-=1.2;if(p.y>H){p.y=-20;p.x=Math.random()*W}}
      else if(snow){c.fillStyle='rgba(255,255,255,'+p.a+')';c.beginPath();c.arc(p.x,p.y,p.r*0.04,0,7);c.fill();p.y+=p.v;p.x+=Math.sin(p.y/30)*0.5;if(p.y>H){p.y=-10;p.x=Math.random()*W}}
      else{var g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'rgba(175,182,192,.16)');g.addColorStop(1,'rgba(175,182,192,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();p.x+=p.v;if(p.x-p.r>W+40){p.x=-p.r-40}}
    });requestAnimationFrame(loop)}
    loop();
  }
  build();
  new MutationObserver(function(){build()}).observe(d.body,{attributes:true,attributeFilter:['class']});
}
f.addEventListener('load',fix);
})();
</script>
</body>
</html>
